<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd1dc"/>
      <stop offset="1" stop-color="#e57fa5"/>
    </linearGradient>
    <style>
      .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff}
      .name{font-size:52px;font-weight:700;letter-spacing:1px;animation:fade 1.6s ease-out both}
      .sub{font-size:22px;animation:fade 1.6s ease-out .6s both}
      .c1{animation:float 7s ease-in-out infinite}
      .c2{animation:float 9s ease-in-out infinite reverse}
      .c3{animation:float 6s ease-in-out infinite}
      @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    </style>
  </defs>
  <rect width="1000" height="240" rx="14" fill="url(#bg)"/>
  <circle class="c1" cx="120" cy="60" r="60" fill="#fff" opacity=".18"/>
  <circle class="c2" cx="880" cy="170" r="80" fill="#fff" opacity=".15"/>
  <circle class="c3" cx="760" cy="40" r="28" fill="#fff" opacity=".22"/>
  <circle class="c2" cx="230" cy="190" r="22" fill="#fff" opacity=".2"/>
  <text class="t name" x="500" y="115" text-anchor="middle">Nazanin Rahgozar</text>
  <text class="t sub" x="500" y="160" text-anchor="middle">Backend &amp; Frontend Developer</text>
</svg>
